# Edge reverse proxy for local / single-host deployments (on AWS the ALB plays this role).
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    error_log  /dev/stderr warn;

    # JSON access log with the request id that is propagated to both services
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
                                '"method":"$request_method","uri":"$uri","status":$status,'
                                '"bytes":$body_bytes_sent,"request_time":$request_time,'
                                '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Edge rate limits (per client IP). The core service additionally rate-limits auth endpoints in Redis.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=analytics:10m rate=5r/s;   # heavy aggregate queries
    limit_req_status 429;

    upstream core      { server core-service:8080; keepalive 32; }
    upstream analytics { server analytics-service:8000; keepalive 16; }
    upstream web       { server web:8080; keepalive 8; }

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://core;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://core;
        }

        location /analytics/ {
            limit_req zone=analytics burst=10 nodelay;
            proxy_pass http://analytics;
        }

        # API documentation
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://core;
        }

        # Only health is public; metrics/prometheus stay on the private network.
        location = /actuator/health          { proxy_pass http://core; }
        location /actuator/health/           { proxy_pass http://core; }
        location /actuator/                  { return 404; }

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        # Everything else is the single-page web app (client-side routing handled by the web container).
        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://web;
        }
    }
}
