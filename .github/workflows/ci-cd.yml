name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: prod

jobs:
  # ---------------------------------------------------------------- 1-3, 6: Java build, tests, quality
  java:
    name: Java - build, test, static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Static analysis (Checkstyle + SpotBugs)
        run: mvn -B -ntp -DskipTests compile checkstyle:check spotbugs:check
      - name: Unit, slice and Testcontainers integration tests
        run: mvn -B -ntp verify
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            core-service/target/surefire-reports
            core-service/target/failsafe-reports
            core-service/target/site/jacoco-merged

  # ---------------------------------------------------------------- 4-6: Python build, tests, quality
  python:
    name: Python - lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest with coverage
        run: pytest -q --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: analytics-service/coverage.xml

  web:
    name: Web frontend - lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  dockerfiles:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: core-service/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: analytics-service/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  # ---------------------------------------------------------------- 7: build images + end-to-end test of the artefacts
  images:
    name: Build images & end-to-end smoke test
    needs: [java, python, web, dockerfiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throw-away secrets for the CI stack
        run: ./scripts/generate-env.sh
      - name: Build and start the full stack (postgres, redis, core, analytics, nginx)
        run: IMAGE_TAG=${{ github.sha }} docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end smoke test through nginx
        run: |
          set -a; . ./.env; set +a
          BASE_URL=http://localhost CHECK_ANALYTICS=true \
          ADMIN_EMAIL="$BOOTSTRAP_ADMIN_EMAIL" ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
          python3 scripts/smoke_test.py
      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gymops-core:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Save images for the push job
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
        run: docker save gymops-core:${{ github.sha }} gymops-analytics:${{ github.sha }} gymops-web:${{ github.sha }} | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------- 8: push to ECR (OIDC, no static keys)
  push:
    name: Push images to ECR
    # runs only once AWS is configured (repository variable AWS_DEPLOY_ROLE_ARN, see docs/AWS_DEPLOYMENT.md)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push (immutable tags = git SHA)
        run: |
          for svc in core analytics web; do
            docker tag gymops-$svc:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/gymops/$svc-service:${{ github.sha }}
            docker push ${{ steps.ecr.outputs.registry }}/gymops/$svc-service:${{ github.sha }}
          done

  # ---------------------------------------------------------------- 9-10: deploy to ECS + health checks
  deploy:
    name: Deploy to AWS ECS
    needs: push
    runs-on: ubuntu-latest
    environment: production   # protected environment: requires manual approval
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Register new task definitions and roll the services
        run: |
          set -eu
          CLUSTER=gymops-${ENVIRONMENT}
          for svc in core analytics web; do
            family=gymops-${ENVIRONMENT}-$svc
            image=${{ needs.push.outputs.registry }}/gymops/$svc-service:${{ github.sha }}
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition > td.json
            jq --arg IMG "$image" '.containerDefinitions[0].image = $IMG
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              td.json > td-new.json
            arn=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$CLUSTER" --service $svc-service --task-definition "$arn" > /dev/null
            echo "$svc-service -> $arn"
          done
          # rolling deployment; the ECS deployment circuit breaker rolls back automatically on failure
          aws ecs wait services-stable --cluster "$CLUSTER" --services core-service analytics-service web-service
      - name: Post-deployment health checks
        run: ./scripts/post_deploy_check.sh "${{ vars.PUBLIC_BASE_URL }}"
